<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecionando para pagamento seguro...</title>
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #080808;
        color: #c9a84c;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <p>Redirecionando para o Mercado Pago...</p>
    <script>
      (function () {
        var target = new URLSearchParams(location.search).get("u");
        if (!target) {
          location.replace("/checkout/failure");
          return;
        }
        try {
          target = decodeURIComponent(target);
        } catch (e) {
          location.replace("/checkout/failure");
          return;
        }
        if (!/^https:\/\/(www\.)?(sandbox\.)?mercadopago\.com\.br\//.test(target)) {
          location.replace("/checkout/failure");
          return;
        }
        location.replace(target);
      })();
    </script>
  </body>
</html>
